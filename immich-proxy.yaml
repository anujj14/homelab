---
apiVersion: v1
kind: Service
metadata:
  name: immich-external-service
spec:
  ports:
  - name: http-web
    protocol: TCP
    port: 2283
    targetPort: 2283

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: immich-external-service
  labels:
    kubernetes.io/service-name: immich-external-service
addressType: IPv4
ports:
  - name: http-web
    protocol: TCP
    port: 2283
endpoints:
  - addresses:
      - "10.42.0.1"

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - immich.snapper-larch.ts.net
  rules:
  - host: immich.snapper-larch.ts.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: immich-external-service
            port:
              number: 2283
