# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
secrets:
  - name: homepage
---
# Secret
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    kubernetes.io/service-account.name: homepage
---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: "Anuj's Homelab"
    theme: dark
    background: https://w.wallhaven.cc/full/po/wallhaven-po2my3.jpg
    backgroundOpacity: 0.6
    backgroundBlur: xl
    cardBlur: lg
    iconAsBackground: true # Makes icons big like Apple TV
    hideVersion: true
    layout:
      Media & Apps:
        style: row
        columns: 4
      Security:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 4
  custom.css: |
    /* Apple TV Style Glass Enhancements */
    #main > div:nth-child(1) > div {
      background-color: rgba(25, 25, 25, 0.4) !important;
      backdrop-filter: blur(24px) saturate(180%) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 24px !important;
      box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.4) !important;
    }
    /* Big floating tiles for icons */
    .service-list .service {
      background-color: rgba(255, 255, 255, 0.05) !important;
      border-radius: 16px !important;
      padding: 10px !important;
      transition: all 0.3s ease !important;
    }
    .service-list .service:hover {
      background-color: rgba(255, 255, 255, 0.1) !important;
      transform: translateY(-5px) scale(1.02); /* Lift effect on hover */
      box-shadow: 0 8px 20px 0 rgba(0, 0, 0, 0.3) !important;
    }
    /* Adjust icon sizing */
    .service-icon {
      width: 48px !important;
      height: 48px !important;
    }
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
      - GitHub:
        - abbr: GH
          href: https://github.com/
      - Youtube:
        - abbr: YT
          href: https://youtube.com/
      - Arch Linux:
        - abbr: AL
          href: https://archlinux.org/news/
  services.yaml: |
    - Media & Apps:
      - Immich:
          href: http://immich.anuj
          description: Photos
          icon: immich.png
      - Navidrome:
          href: http://navidrome.anuj
          description: Music
          icon: navidrome.png
    - Security:
      - Vaultwarden:
          href: https://vaultwarden.anuj
          description: Passwords
          icon: vaultwarden.png
    - Infrastructure:
      - AdGuard Home:
          href: https://adguard.anuj
          description: DNS
          icon: adguard-home.png
      - ArgoCD:
          href: https://argocd.anuj
          description: GitOps
          icon: argocd.png
      - Tailscale:
          href: https://login.tailscale.com/admin/machines
          description: VPN
          icon: tailscale.png
      - Homepage:
          href: http://home.anuj
          description: Dashboard
          icon: homepage.png
  widgets.yaml: |
    - greeting:
        text_size: 3xl
        text: "Hello Anuj"
    - datetime:
        text_size: 2xl
        format:
          timeStyle: short
          dateStyle: long
          hourCycle: h23
    - search:
        provider: custom
        url: http://search.anuj/search?q=
        target: _blank
---
# ClusterRole and ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "gateways"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: default
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: homepage
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      initContainers:
        - name: init-config
          image: busybox:latest
          command: ['sh', '-c', 'cp -r /configmap/. /app/config/']
          volumeMounts:
            - name: configmap
              mountPath: /configmap
            - name: config
              mountPath: /app/config
      containers:
        - name: homepage
          image: "ghcr.io/gethomepage/homepage:latest"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
          - name: HOMEPAGE_ALLOWED_HOSTS
            value: "home.anuj"
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
              httpHeaders:
              - name: Host
                value: "home.anuj"
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: logs
              mountPath: /app/config/logs
      volumes:
        - name: configmap
          configMap:
            name: homepage
        - name: config
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  ingressClassName: traefik
  rules:
  - host: home.anuj
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: homepage
            port:
              number: 3000
