# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
secrets:
  - name: homepage
---
# Secret
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    kubernetes.io/service-account.name: homepage
---
---
# Glances Deployment 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glances
  labels:
    app.kubernetes.io/name: glances
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glances
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glances
    spec:
      hostPID: true 
      containers:
        - name: glances
          image: nicolargo/glances:latest-full
          ports:
            - name: http
              containerPort: 61208
              protocol: TCP
          volumeMounts:
            - name: rootfs
              mountPath: /host
              readOnly: true
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: rootfs
          hostPath:
            path: /
            type: Directory
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
---
# Glances Service
apiVersion: v1
kind: Service
metadata:
  name: glances
spec:
  selector:
    app.kubernetes.io/name: glances
  ports:
    - port: 61208
      targetPort: http
      name: http
---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: "Anuj's Homelab"
    theme: dark
    background: https://w.wallhaven.cc/full/po/wallhaven-po2my3.jpg
    backgroundOpacity: 0.6
    backgroundBlur: sm
    cardBlur: md
    iconAsBackground: false
    hideVersion: true
    layout:
      Media & Apps:
        style: row
        columns: 4
      Security:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 4
  custom.css: |
    /* Liquid Glass Theme Enhancements */
    #main > div:nth-child(1) > div {
      background-color: rgba(25, 25, 25, 0.5) !important;
      backdrop-filter: blur(16px) saturate(180%) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 16px !important;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3) !important;
    }
    .service-list .service {
      background-color: transparent !important;
    }
    .service-list .service:hover {
      background-color: rgba(255, 255, 255, 0.1) !important;
      transform: translateY(-2px);
      transition: all 0.2s ease;
    }
  custom.js: ""
  bookmarks.yaml: |
    - Homelab:
      - GitHub:
        - abbr: GH
          href: https://youtube.com/
      - Arch Linux:
        - abbr: AL
          href: https://archlinux.org/news/
  services.yaml: |
    - Media & Apps:
      - Immich:
          href: http://immich.anuj
          description: Photo & Video Backup
          icon: immich.png
      - Navidrome:
          href: http://navidrome.anuj
          description: Music Server
          icon: navidrome.png
    - Security:
      - Vaultwarden:
          href: http://vaultwarden.anuj
          description: Password Manager
          icon: vaultwarden.png
    - Infrastructure:
      - AdGuard Home:
          href: http://adguard.anuj
          description: DNS & Ad Blocking
          icon: adguard-home.png
      - ArgoCD:
          href: http://argocd.anuj
          description: GitOps Deployment
          icon: argocd.png
      - Tailscale:
          href: https://login.tailscale.com/admin/machines
          description: Mesh VPN Access
          icon: tailscale.png
      - Homepage:
          href: http://home.anuj
          description: Dashboard
          icon: homepage.png
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "K3s Cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - glances:
        url: http://glances.default.svc.cluster.local:61208
        label: "My Laptop"
        cpu: true
        mem: true
        disk: / 
        uptime: true
        expanded: true
    - search:
        provider: duckduckgo
        target: _blank
---
# ClusterRole and ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "gateways"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: default
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: homepage
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      initContainers:
        - name: init-config
          image: busybox:latest
          command: ['sh', '-c', 'cp -r /configmap/. /app/config/']
          volumeMounts:
            - name: configmap
              mountPath: /configmap
            - name: config
              mountPath: /app/config
      containers:
        - name: homepage
          image: "ghcr.io/gethomepage/homepage:latest"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
          - name: HOMEPAGE_ALLOWED_HOSTS
            value: "home.anuj"
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
              httpHeaders:
              - name: Host
                value: "home.anuj"
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: logs
              mountPath: /app/config/logs
      volumes:
        - name: configmap
          configMap:
            name: homepage
        - name: config
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "traefik"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Homepage"
    gethomepage.dev/description: "Dynamically Detected Homepage"
    gethomepage.dev/group: "Cluster Management"
    gethomepage.dev/icon: "homepage.png"
spec:
  ingressClassName: traefik
  rules:
  - host: home.anuj
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: homepage
            port:
              number: 3000
