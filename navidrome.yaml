apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  labels:
    app: navidrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      containers:
      - name: navidrome
        image: deluan/navidrome:latest
        ports:
        - containerPort: 4533
        readinessProbe:
          httpGet:
            path: /
            port: 4533
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /
            port: 4533
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 2
        volumeMounts:
        - name: navidrome-data
          mountPath: /data
        - name: navidrome-music
          mountPath: /music
          readOnly: true
      volumes:
      - name: navidrome-data
        hostPath:
          path: /home/anuj/navidrome/data
          type: DirectoryOrCreate
      - name: navidrome-music
        hostPath:
          path: /home/anuj/navidrome/music
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: navidrome-service
spec:
  type: LoadBalancer # tmp access from hotspot, change to ClusterIP later.
  selector:
    app: navidrome
  ports:
  - protocol: TCP
    port: 4533
    targetPort: 4533
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: navidrome-ingress
spec:
  rules:
  - host: navidrome.anuj
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: navidrome-service
            port:
              number: 4533
