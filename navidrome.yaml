# 1. Deployment 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  labels:
    app: navidrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      containers:
      - name: navidrome
        image: deluan/navidrome:latest
        ports:
        - containerPort: 4533
        volumeMounts:
        - name: navidrome-data
          mountPath: /data
        - name: navidrome-music
          mountPath: /music
          readOnly: true
      volumes:
      - name: navidrome-data
        hostPath:
          path: /home/anuj/navidrome/data
          type: DirectoryOrCreate
      - name: navidrome-music
        hostPath:
          path: /home/anuj/navidrome/music
          type: Directory

---
# 2. Service 
apiVersion: v1
kind: Service
metadata:
  name: navidrome-service
spec:
  type: LoadBalancer
  selector:
    app: navidrome
  ports:
  - protocol: TCP
    port: 4533
    targetPort: 4533

---
# 3. Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: navidrome-ingress
spec:
  rules:
  - host: navidrome.anuj
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: navidrome-service
            port:
              number: 4533
