# Glance Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
  namespace: default
data:
  glance.yml: |
    theme:
      primary-color: 140 70 50
      radius: 18px
      
    pages:
      # ==========================================
      # PAGE 1: HOMELAB
      # ==========================================
      - name: Homelab
        columns:
          # LEFT COLUMN
          - size: small
            widgets:
              - type: calendar
                first-day-of-week: monday
                
              # AdGuard Native DNS Stats Widget
              - type: dns-stats
                title: AdGuard Home
                service: adguard
                url: http://adguard-external-service.default.svc.cluster.local:8081
                username: ${HOMEPAGE_VAR_ADGUARD_USER}
                password: ${HOMEPAGE_VAR_ADGUARD_PASS}

              - type: releases
                cache: 1d
                repositories:
                  - immich-app/immich
                  - syncthing/syncthing
                  - navidrome/navidrome
                  - dani-garcia/vaultwarden
                  - glanceapp/glance

          # CENTER COLUMN
          - size: full
            widgets:
              - type: search
                autofocus: false
                search-engine: https://searxng.snapper-larch.ts.net/search?q={QUERY}
                
              - type: monitor
                title: Service Links & Status
                cache: 1m
                sites:
                  - title: Navidrome
                    url: https://navidrome.snapper-larch.ts.net
                    check-url: http://navidrome-service.default.svc.cluster.local:4533
                    icon: sh:navidrome
                  - title: Vaultwarden
                    url: https://vaultwarden.snapper-larch.ts.net
                    check-url: http://vaultwarden-service.default.svc.cluster.local:80
                    icon: sh:vaultwarden
                  - title: SearXNG
                    url: https://searxng.snapper-larch.ts.net
                    check-url: http://searxng.searxng.svc.cluster.local:8080
                    icon: sh:searxng
                  - title: Tailscale
                    url: https://login.tailscale.com/admin/machines
                    check-url: https://status.tailscale.com
                    icon: si:tailscale

          # RIGHT COLUMN
          - size: small
            widgets:
              - type: weather
                location: Pune, India
                units: metric
                hour-format: 12h
                
              # Immich Custom API Widget
              - type: custom-api
                title: Immich Stats
                icon: sh:immich
                cache: 1h
                url: http://immich-external-service.default.svc.cluster.local:2283/api/server/statistics
                headers:
                  x-api-key: ${HOMEPAGE_VAR_IMMICH_KEY}
                  Accept: application/json
                template: |
                  <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                    <span>🖼️ Photos:</span>
                    <strong style="color: var(--positive-color)">{{ .JSON.Int "photos" }}</strong>
                  </div>
                  <div style="display: flex; justify-content: space-between;">
                    <span>🎥 Videos:</span>
                    <strong style="color: var(--positive-color)">{{ .JSON.Int "videos" }}</strong>
                  </div>

              # ArgoCD Custom API Widget
              - type: custom-api
                title: ArgoCD
                icon: si:argocd
                cache: 1m
                url: https://argocd.snapper-larch.ts.net/api/v1/applications
                headers:
                  Authorization: Bearer ${HOMEPAGE_VAR_ARGOCD_TOKEN}
                  Accept: application/json
                template: |
                  <div style="display: flex; justify-content: space-between;">
                    <span>📦 Synced Apps:</span>
                    <strong style="color: var(--positive-color)">{{ len (.JSON.Array "items") }}</strong>
                  </div>

              - type: server-stats
                servers:
                  - type: local
                    name: Yoga k3s

              - type: repository
                repository: anujj14/homelab
                commits-limit: 3
                
      # ==========================================
      # PAGE 2: FEED
      # ==========================================
      - name: Feed
        columns:
          - size: small
            widgets:
              - type: clock
                hour-format: 12h
                timezone: Asia/Kolkata

              - type: calendar
                first-day-of-week: monday
    
              - type: rss
                limit: 10
                collapse-after: 3
                cache: 12h
                feeds:
                  - url: https://selfh.st/rss/
                    title: selfh.st
                    limit: 4
                  - url: https://ciechanow.ski/atom.xml
                  - url: https://www.joshwcomeau.com/rss.xml
                    title: Josh Comeau
                  - url: https://samwho.dev/rss.xml
                  - url: https://ishadeed.com/feed.xml
                    title: Ahmad Shadeed
    
              - type: twitch-channels
                channels:
                  - theprimeagen
                  - j_blow
                  - giantwaffle
                  - cohhcarnage
                  - christitustech
                  - EJ_SA
    
          - size: full
            widgets:
              - type: group
                widgets:
                  - type: hacker-news
                  - type: lobsters
    
              - type: group
                widgets:
                  - type: reddit
                    subreddit: technology
                    show-thumbnails: true
                  - type: reddit
                    subreddit: selfhosted
                    show-thumbnails: true
    
          - size: small
            widgets:
              - type: weather
                location: Pune, India
                units: metric 
                hour-format: 12h 
                # hide-location: true
    
              - type: markets
                markets:
                  - symbol: ^NSEI
                    name: Nifty 50
                  - symbol: GOLDIETF.NS
                    name: ICICI Gold ETF
                  - symbol: SILVERIETF.NS
                    name: ICICI Silver ETF
                  
              - type: videos
                channels:
                  - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
                  - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling
                  - UCsBjURrPoezykLs9EqgamOA # Fireship
                  - UCBJycsmduvYEL83R_U4JriQ # Marques Brownlee
                  - UCHnyfMqiRRG1u-2MsSQLbXA # Veritasium

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glance
  template:
    metadata:
      labels:
        app: glance
    spec:
      containers:
        - name: glance
          image: glanceapp/glance:latest
          ports:
            - containerPort: 8080
          env:
            - name: HOMEPAGE_VAR_IMMICH_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: immich-key
            - name: HOMEPAGE_VAR_ADGUARD_USER
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: adguard-user
            - name: HOMEPAGE_VAR_ADGUARD_PASS
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: adguard-pass
            - name: HOMEPAGE_VAR_ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: argocd-token
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/glance.yml
              subPath: glance.yml
      volumes:
        - name: config-volume
          configMap:
            name: glance-config

---
apiVersion: v1
kind: Service
metadata:
  name: glance-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: glance
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glance-ingress
  namespace: default
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - glance.snapper-larch.ts.net
  rules:
  - host: glance.snapper-larch.ts.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: glance-service
            port:
              number: 8080
