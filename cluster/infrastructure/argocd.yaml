apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://argoproj.github.io/argo-helm'
    targetRevision: '10.9.6'
    chart: argo-cd
    helm:
      values: |
        dex:
          enabled: false
        notifications:
          enabled: false
        applicationSet:
          enabled: false
        configs:
          cm:
            accounts.widgets: apiKey
            timeout.reconciliation: 600s
          rbac:
            policy.csv: |
              g, widgets, role:readonly
        server:
          ingress:
            enabled: true
            ingressClassName: tailscale
            hosts:
              - argocd.snapper-larch.ts.net
            tls:
              - hosts:
                  - argocd.snapper-larch.ts.net
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-sync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/anujj14/homelab.git'
    path: cluster
    targetRevision: main
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
