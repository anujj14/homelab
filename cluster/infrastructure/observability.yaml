apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      name: grafana-admin-credentials
      namespace: monitoring
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: '91.8.2'
    helm:
      valuesObject:
        alertmanager:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false
        defaultRules:
          create: false
        prometheusOperator:
          admissionWebhooks:
            enabled: false
            patch:
              enabled: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        prometheus:
          prometheusSpec:
            scrapeInterval: 60s
            evaluationInterval: 60s
            retention: 2d
            retentionSize: 1GB
            walCompression: true
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelector: {}
            serviceMonitorNamespaceSelector: {}
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 512Mi
        grafana:
          admin:
            existingSecret: grafana-admin-credentials
          sidecar:
            alerts:
              enabled: false
            notifiers:
              enabled: false
          resources:
            requests:
              cpu: 15m
              memory: 256Mi
            limits:
              memory: 512Mi
          ingress:
            enabled: true
            ingressClassName: tailscale
            hosts:
              - grafana
            tls:
              - hosts:
                  - grafana
        kube-state-metrics:
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              memory: 64Mi
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 48Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
