---
apiVersion: v1
kind: Service
metadata:
  name: adguard-external-service
spec:
  ports:
  - name: http-admin
    port: 8081
    targetPort: 8081

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: adguard-external-service
  labels:
    kubernetes.io/service-name: adguard-external-service
addressType: IPv4
ports:
  - name: http-admin
    port: 8081
endpoints:
  - addresses:
      - "10.42.0.1"

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adguard-ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - adguard.snapper-larch.ts.net
  rules:
  - host: adguard.snapper-larch.ts.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: adguard-external-service
            port:
              number: 8081
