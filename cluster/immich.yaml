apiVersion: v1
kind: Namespace
metadata:
  name: immich
  labels:
    app.kubernetes.io/part-of: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-10"

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library-pv
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  capacity:
    storage: 900Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /home/anuj/immich-app/library
    type: Directory

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: immich-library-pv
  resources:
    requests:
      storage: 900Gi

---
# PostgreSQL service used by Immich.
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
  labels:
    app.kubernetes.io/name: immich-postgres
    app.kubernetes.io/part-of: immich
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: immich-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
  labels:
    app.kubernetes.io/name: immich-postgres
    app.kubernetes.io/part-of: immich
spec:
  serviceName: immich-postgres
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-postgres
        app.kubernetes.io/part-of: immich
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            - name: DB_STORAGE_TYPE
              value: SSD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - immich
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - immich
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - immich
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: ghcr.io/immich-app/immich-charts
    chart: immich
    targetRevision: 0.12.1
    helm:
      releaseName: immich
      values: |
        defaultPodOptions:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

        controllers:
          main:
            containers:
              main:
                image:
                  tag: v3.2.1
                env:
                  REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
                  IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
                  DB_HOSTNAME: immich-postgres
                  DB_USERNAME: postgres
                  DB_DATABASE_NAME: immich
                  DB_PASSWORD:
                    valueFrom:
                      secretKeyRef:
                        name: immich-postgres-secret
                        key: POSTGRES_PASSWORD

        immich:
          metrics:
            enabled: false
          persistence:
            library:
              existingClaim: immich-library

        valkey:
          enabled: true
          persistence:
            data:
              enabled: true
              type: emptyDir

          ingress:
            main:
              enabled: true
              className: tailscale
              hosts:
                - host: immich.snapper-larch.ts.net
                  paths:
                    - path: /
                      pathType: Prefix
                      service:
                        identifier: main
                        port: http
              tls:
                - hosts:
                    - immich.snapper-larch.ts.net

        machine-learning:
          enabled: true
          persistence:
            cache:
              enabled: true
              type: persistentVolumeClaim
              size: 10Gi
              accessMode: ReadWriteOnce
              storageClass: local-path

        serviceMonitor:
          main:
            labels:
              release: kube-prometheus-stack

  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

