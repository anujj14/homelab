#   -2  Namespaces, StorageClass, PersistentVolumes 
#   -1  CloudNativePG operator (installed via Helm through ArgoCD)
#    0  The Postgres cluster itself (with the VectorChord extension Immich needs)
#    1  Immich itself (official immich-charts Helm chart)

apiVersion: v1
kind: Namespace
metadata:
  name: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: manual
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library-pv
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  capacity:
    storage: 500Gi          
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /home/anuj/immich-app/library
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - yoga
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  volumeName: immich-library-pv
  resources:
    requests:
      storage: 500Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-postgres-pv
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  capacity:
    storage: 20Gi           
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /home/anuj/immich-app/postgres
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - yoga
---
# CloudNativePG operator - manages the Postgres "Cluster" CRD below
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: 'https://cloudnative-pg.github.io/charts'
    targetRevision: '0.*'
    chart: cloudnative-pg
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# Postgres cluster for Immich, with the VectorChord extension 
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1               
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.10-0.5.3
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-database-app   # CNPG auto-generates and stores the password here
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS cube;
        - CREATE EXTENSION IF NOT EXISTS earthdistance;
  storage:
    size: 20Gi
    storageClass: manual
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      storageClassName: manual
      volumeName: immich-postgres-pv
      resources:
        requests:
          storage: 20Gi
---
# Immich itself
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'oci://ghcr.io/immich-app/immich-charts'
    chart: immich
    targetRevision: '0.*'
    helm:
      values: |
        # Shared env vars, applied to every Immich component (server,
        # machine-learning, etc.) by the bjw-s common library this chart uses.
        controllers:
          main:
            containers:
              main:
                image:
                  tag: v3.2.1
                env:
                  REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
                  IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
                  DB_HOSTNAME: immich-database-rw
                  DB_USERNAME: immich
                  DB_DATABASE_NAME: immich
                  DB_PASSWORD:
                    valueFrom:
                      secretKeyRef:
                        name: immich-database-app
                        key: password

        # Bundled Redis/Valkey (job queue + cache) - fine to lose on restart
        valkey:
          enabled: true

        immich:
          persistence:
            library:
              existingClaim: immich-library

        server:
          enabled: true
          ingress:
            main:
              enabled: true
              className: tailscale
              hosts:
                - host: immich.snapper-larch.ts.net
                  paths:
                    - path: "/"
                      service:
                        identifier: main
              tls:
                - hosts:
                    - immich.snapper-larch.ts.net

        machine-learning:
          enabled: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
