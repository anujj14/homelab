# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: "Anuj's Homelab"
    theme: dark
    background: https://w.wallhaven.cc/full/9o/wallhaven-9orv7w.png
    backgroundOpacity: 0.7
    backgroundBlur: sm
    cardBlur: xl
    iconAsBackground: true
    hideVersion: true
    layout:
      Bookmarks:
        style: row
        columns: 4
      Homelab:
        style: row
        columns: 3
  custom.css: |
    :root {
      --glass-bg: rgba(30, 30, 30, 0.35);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-hover-border: rgba(255, 255, 255, 0.25);
      --glass-blur: blur(25px) saturate(150%);
    }

    .services-list li > div {
      background-color: var(--glass-bg) !important;
      backdrop-filter: var(--glass-blur) !important;
      -webkit-backdrop-filter: var(--glass-blur) !important;
      border: 1px solid var(--glass-border) !important;
      border-radius: 16px !important;
      transition: all 0.2s ease-in-out !important;
    }

    .services-list li:hover > div {
      transform: translateY(-2px) !important; 
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3) !important;
      border-color: var(--glass-hover-border) !important;
      background-color: rgba(45, 45, 45, 0.5) !important;
    }

    .service-icon {
      width: 60px !important;
      height: 60px !important;
      border-radius: 14px !important;
    }
  custom.js: ""
  bookmarks.yaml: "" 
  services.yaml: |
    - Bookmarks:
      - GitHub:
          href: https://github.com/
          description: Code Repository
          icon: si-github
      - Youtube:
          href: https://youtube.com/
          description: Video Streaming
          icon: si-youtube
      - Arch Linux:
          href: https://archlinux.org/news/
          description: OS Updates
          icon: si-archlinux
    - Homelab:
      - Immich:
          href: http://immich.anuj
          description: Photos
          icon: immich.png
          widget:
            type: immich
            url: http://immich-external-service.default.svc.cluster.local:2283
            key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
            version: 2
            fields: ["photos", "videos", "storage"] 
      - AdGuard Home:
          href: http://adguard.anuj
          description: DNS
          icon: adguard-home.png
          widget:
            type: adguard
            url: http://adguard-external-service.default.svc.cluster.local:8081
            username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
            password: "{{HOMEPAGE_VAR_ADGUARD_PASS}}"
      - ArgoCD:
          href: https://argocd.anuj
          description: GitOps
          icon: https://argo-cd.readthedocs.io/en/stable/assets/logo.png
          widget:
            type: argocd
            url: http://argocd-server.argocd.svc.cluster.local:80 
            key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"
            fields: ["apps", "synced", "healthy", "degraded"]
      - Navidrome:
          href: http://navidrome.anuj
          description: Music
          icon: navidrome.png
      - Vaultwarden:
          href: https://vaultwarden.anuj
          description: Passwords
          icon: vaultwarden.png
      - Tailscale:
          href: https://login.tailscale.com/admin/machines
          description: VPN
          icon: tailscale.png
  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /
    - kubernetes:
        cluster:
          show: false
          cpu: true
          memory: true
          showLabel: true
          label: "Yoga k3s"
        nodes:
          show: false
    - datetime:
        text_size: xl
        locale: en-GB
        format:
          hour: "2-digit"
          minute: "2-digit"
          second: "2-digit"
          hourCycle: h23
          weekday: short
          day: numeric
          month: short
    - search:
        provider: custom
        url: http://search.anuj/search?q=
        target: _blank
---
# ClusterRole and ClusterRoleBinding 
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: default
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: homepage
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      initContainers:
        - name: init-config
          image: busybox:latest
          command: ['sh', '-c', 'cp -r /configmap/. /app/config/']
          volumeMounts:
            - name: configmap
              mountPath: /configmap
            - name: config
              mountPath: /app/config
      containers:
        - name: homepage
          image: "ghcr.io/gethomepage/homepage:latest"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          env:
          - name: HOMEPAGE_ALLOWED_HOSTS
            value: "home.anuj"
          - name: NODE_TLS_REJECT_UNAUTHORIZED
            value: "0"
          - name: HOMEPAGE_VAR_IMMICH_KEY
            valueFrom:
              secretKeyRef:
                name: homepage-secrets
                key: immich-key
          - name: HOMEPAGE_VAR_ADGUARD_USER
            valueFrom:
              secretKeyRef:
                name: homepage-secrets
                key: adguard-user
          - name: HOMEPAGE_VAR_ADGUARD_PASS
            valueFrom:
              secretKeyRef:
                name: homepage-secrets
                key: adguard-pass
          - name: HOMEPAGE_VAR_ARGOCD_TOKEN
            valueFrom:
              secretKeyRef:
                name: homepage-secrets
                key: argocd-token
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
              httpHeaders:
              - name: Host
                value: "home.anuj"
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: logs
              mountPath: /app/config/logs
      volumes:
        - name: configmap
          configMap:
            name: homepage
        - name: config
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
# Ingress 
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage-ingress
  namespace: default
spec:
  ingressClassName: traefik
  rules:
  - host: home.anuj
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: homepage
            port:
              number: 3000
