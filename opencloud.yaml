apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
  labels:
    app: opencloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opencloud
  template:
    metadata:
      labels:
        app: opencloud
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: opencloud
          image: opencloudeu/opencloud-rolling:7.4.0
          command: ["/bin/sh", "-c", "opencloud init || true; opencloud server"]
          env:
            - name: OC_URL
              value: "https://opencloud.snapper-larch.ts.net" 
            - name: OC_LOG_LEVEL
              value: "info"
            - name: PROXY_TLS
              value: "false"
            - name: OC_INSECURE
              value: "true"
            - name: IDM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencloud-secrets
                  key: admin-password
            - name: OC_DEFAULT_LANGUAGE
              value: "en"
          ports:
            - containerPort: 9200
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /
              port: 9200
            periodSeconds: 5
            failureThreshold: 24   # 2 min grace
          readinessProbe:
            httpGet:
              path: /
              port: 9200
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /
              port: 9200
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: config
              mountPath: /etc/opencloud
            - name: data
              mountPath: /var/lib/opencloud
      volumes:
        - name: config
          hostPath:
            path: /home/anuj/opencloud/config
            type: Directory
        - name: data
          hostPath:
            path: /home/anuj/opencloud/data
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: opencloud-svc
spec:
  selector:
    app: opencloud
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9200
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencloud-ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
      - opencloud.snapper-larch.ts.net 
  rules:
    - host: opencloud.snapper-larch.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opencloud-svc
                port:
                  number: 80
